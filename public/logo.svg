<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring Gradient 1 -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Ring Gradient 2 -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Core Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Lightning / S Gradient -->
    <linearGradient id="stormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Outer Orbital Energy Ring 1 -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="url(#ringGrad1)" stroke-width="5" stroke-dasharray="140 18 40 18" transform="rotate(-30 256 256)" opacity="0.9" filter="url(#softGlow)"/>
  
  <!-- Outer Orbital Energy Ring 2 -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="url(#ringGrad2)" stroke-width="4.5" stroke-dasharray="100 25 60 25" transform="rotate(40 256 256)" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Orbital Spark Nodes -->
  <circle cx="90" cy="170" r="6" fill="#67e8f9" filter="url(#softGlow)"/>
  <circle cx="430" cy="330" r="5" fill="#c084fc" filter="url(#softGlow)"/>
  <circle cx="380" cy="130" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="140" cy="390" r="6" fill="#818cf8" filter="url(#softGlow)"/>

  <!-- Central Hexagonal Tech Shield -->
  <polygon points="256,65 405,150 405,320 256,405 107,320 107,150" fill="url(#shieldGrad)" stroke="url(#ringGrad1)" stroke-width="6" filter="url(#softGlow)"/>

  <!-- Inner Hexagon Contour -->
  <polygon points="256,85 385,160 385,308 256,385 127,308 127,160" fill="#070d1e" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Subtle Cyber Grid in Shield -->
  <line x1="256" y1="85" x2="256" y2="385" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>
  <line x1="127" y1="235" x2="385" y2="235" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- High-Energy STORM Lightning S Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Top arm of S -->
    <path d="M 330,135 L 205,135 C 160,135 140,165 145,205 C 150,240 180,255 220,265 L 290,280 C 330,290 350,310 345,345 C 340,385 300,405 245,405 L 180,405 L 195,365 L 245,365 C 280,365 300,355 305,335 C 308,318 295,305 265,298 L 195,282 C 155,272 132,250 138,210 C 145,165 180,135 240,135 L 345,135 Z" fill="url(#stormGrad)"/>
    
    <!-- Central Sharp Lightning Bolt Slash across S -->
    <polygon points="280,105 220,240 285,240 225,410 295,265 240,265" fill="#ffffff" opacity="0.98" filter="url(#softGlow)"/>
  </g>

  <!-- Pulse Beads -->
  <circle cx="256" cy="65" r="7" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="256" cy="405" r="7" fill="#67e8f9" filter="url(#softGlow)"/>
</svg>